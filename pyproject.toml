[project]
name = "xlg"
version = "0.1.0"
description = "eXpression LanGuage - express complex operations in single commands"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openai>=2.21.0",
]

[project.scripts]
xlg = "xlg.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["xlg*"]

[tool.ruff]
line-length = 170

[tool.pytest.ini_options]
testpaths = ["xlg", "tests"]
python_files = ["*_test.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
]

[project]
name = "xlg"
version = "0.1.0"
description = "eXpression LanGuage - express complex operations in single commands"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.12",
    "httpx>=0.27",
    "openai>=2.21.0",
    "xlg-player",
    "playwright>=1.40",
    "anthropic>=0.40",
    "mcp>=1.0",
]

[project.scripts]
xlg = "xlg.main:main"
xlg-mcp = "xlg.mcp_server:main"

[tool.uv]
package = true

[tool.uv.sources]
xlg-player = { path = "../xlg-player" }

[tool.setuptools.packages.find]
include = ["xlg*"]

[tool.ruff]
line-length = 170

[tool.pytest.ini_options]
testpaths = ["xlg", "tests"]
python_files = ["*_test.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
]

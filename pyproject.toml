[project]
name = "xlg"
version = "0.1.0"
description = "eXpression LanGuage - express complex operations in single commands"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
xlg = "xlg.main:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 170

[tool.pytest.ini_options]
testpaths = ["xlg"]
python_files = ["*_test.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]
